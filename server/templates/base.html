<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REZO AGWE // ACCESS POINT</title>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,1,0"
        rel="stylesheet" />

    <script type="importmap">
      { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

    <style>
        /* --- RESPONSIVE ORIENTATION SUPPORT FOR BASE LAYOUT --- */
        @media screen and (max-width: 768px), screen and (orientation: portrait) {
            .app-container {
                flex-direction: column-reverse !important; /* Navigation at bottom */
            }

            .vdb-rail {
                width: 100% !important;
                flex-direction: row !important;
                border-right: none !important;
                border-top: 2px solid var(--primary-color, #ff5e5e) !important;
                border-bottom: none !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
            }
        }

        /* Extra specific rule for portrait orientation */
        @media screen and (orientation: portrait) {
            .app-container {
                flex-direction: column-reverse !important;
            }

            .vdb-rail {
                width: 100% !important;
                flex-direction: row !important;
                border-right: none !important;
                border-top: 2px solid var(--primary-color, #ff5e5e) !important;
                border-bottom: none !important;
            }

            .rail-nav-items {
                flex-direction: row;
                width: 100%;
                justify-content: space-around;
            }

            .nav-item {
                flex-direction: column;
                padding: 0.5rem;
                min-width: 60px;
            }

            .nav-icon {
                font-size: 1.5rem;
            }

            .nav-label {
                font-size: 0.65rem;
                margin-top: 0.25rem;
            }

            .nav-indicator {
                width: 100%;
                height: 3px;
                top: auto;
                bottom: 0;
                left: 0;
            }

            .content-area {
                flex: 1;
                overflow-y: auto;
            }
        }

        @media screen and (orientation: landscape) and (max-height: 600px) {
            .vdb-rail {
                width: 60px;
            }

            .nav-label {
                font-size: 0.7rem;
            }

            .nav-icon {
                font-size: 1.3rem;
            }

            .nav-item {
                padding: 0.75rem 0.5rem;
            }
        }

        @media screen and (max-width: 480px) {
            .nav-label {
                font-size: 0.6rem;
            }

            .nav-icon {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>
    <div class="app-container">
        <nav class="vdb-rail">
            <div class="rail-nav-items">
                <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">fingerprint</span>
                    <span class="nav-label">Subject</span>
                </a>

                <a href="/map" class="nav-item {% if active_page == 'map' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">map</span>
                    <span class="nav-label">Map</span>
                </a>

                <a href="/locations" class="nav-item {% if active_page == 'locations' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">gps_not_fixed</span>
                    <span class="nav-label">Locations</span>
                </a>

                <a href="/insights" class="nav-item {% if active_page == 'insights' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">data_exploration</span>
                    <span class="nav-label">Insights</span>
                </a>

                <a href="/quests" class="nav-item {% if active_page == 'quests' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">auto_stories</span>
                    <span class="nav-label">Quests</span>
                </a>

                <a href="/events" class="nav-item {% if active_page == 'events' %}active{% endif %}">
                    <div class="nav-indicator"></div>
                    <span class="material-symbols-sharp nav-icon">calendar_month</span>
                    <span class="nav-label">Archive</span>
                </a>
            </div>
        </nav>

        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
